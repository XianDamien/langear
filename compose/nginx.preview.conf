# Canonical staging preview proxy. Install with:
#   python3 scripts/release/manage.py sync-config
# Edit here, not on the server: the deploy root copy is disposable.
server {
    listen 8445 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/preview.crt;
    ssl_certificate_key /etc/nginx/certs/preview.key;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /api/v1/dashboard {
        auth_request /_dev_auth_check;
        proxy_pass http://legacy-library-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /_dev_auth_check {
        internal;
        proxy_pass http://legacy-library-api:8000/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host backend;
    }
    location /api/ {
        proxy_pass http://legacy-library-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /health { proxy_pass http://legacy-library-api:8000; }
}
