services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-langear}
      POSTGRES_USER: ${POSTGRES_USER:-langear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langear}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langear} -d ${POSTGRES_DB:-langear}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - langear_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend-migrate:
    image: langear-backend:local
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    volumes:
      - langear_backend_data:/app/data
    restart: "no"

  backend:
    image: langear-backend:local
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - langear_backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  langear_backend_data:
  langear_postgres_data:
