name: Verify and Package Release

on:
  pull_request:
  push:
    branches: [main, dev/staging]
  workflow_dispatch:
    inputs:
      operation:
        description: Build/deploy staging or promote an accepted release
        type: choice
        options: [release, promote]
        default: release
      run_id:
        description: Successful release CI run ID (promotion only)
        type: string
      checks:
        description: Completed staging acceptance checks (promotion only)
        type: string
      runtime:
        description: Release runtime contract
        required: true
        default: core-v1
        type: choice
        options: [core, core-v1]
      api_base_url:
        description: Frontend VITE_API_BASE_URL
        required: true
        default: /api/v1
        type: string

permissions:
  contents: read

env:
  RELEASE_RUNTIME: ${{ github.event.inputs.runtime || 'core-v1' }}
  VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || '/api/v1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_HTTP_TIMEOUT: '120'
  UV_HTTP_RETRIES: '3'

# Images go directly to GHCR. Only a small manifest is retained as an artifact.
jobs:
  verify-and-package:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    services:
      core-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lan30_test_ci
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_test -d lan30_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate release contract
        run: |
          case "$RELEASE_RUNTIME" in
            core) expected=/api/content/v1 ;;
            core-v1) expected=/api/v1 ;;
            *) echo "Unknown RELEASE_RUNTIME: $RELEASE_RUNTIME"; exit 1 ;;
          esac
          if [ "$VITE_API_BASE_URL" != "$expected" ]; then
            echo "RELEASE_RUNTIME=$RELEASE_RUNTIME requires VITE_API_BASE_URL=$expected"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check release tooling
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Collection core PostgreSQL integration tests
        working-directory: backend
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://core_test:isolated-ci-only@127.0.0.1:5432/lan30_test_ci
        run: |
          uv sync --locked
          uv run bash ../scripts/release/test-core.sh -q
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test:unit
          pnpm build
      - name: Prepare image names and frontend revision
        if: github.event_name != 'pull_request'
        id: images
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "backend=$repository/backend:$RELEASE_SHA-$RELEASE_RUNTIME" >> "$GITHUB_OUTPUT"
          echo "frontend=$repository/frontend:$RELEASE_SHA-$RELEASE_RUNTIME" >> "$GITHUB_OUTPUT"
          python3 -c 'import json, os; from pathlib import Path; Path("frontend/dist/release.json").write_text(json.dumps({"sha": os.environ["RELEASE_SHA"]}) + "\n")'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image with layer cache
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.backend }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build matching frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: frontend/dist
          file: scripts/release/Dockerfile.frontend
          load: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.images.outputs.frontend }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Publish images and record immutable digests
        if: github.event_name != 'pull_request'
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          python3 scripts/release/registry.py "$RELEASE_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" release
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: langear-release-${{ github.sha }}
          path: release/
          retention-days: 90
          if-no-files-found: error

  deploy-staging:
    needs: verify-and-package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev/staging'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: langear-staging-runtime
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: langear-release-${{ github.sha }}
          path: release
      - name: Skip superseded automatic releases
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev/staging" --jq .object.sha)
          if [ "$head_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer dev/staging commit exists; skipping this deployment.'
          fi
      - name: Deploy tested images directly from GHCR
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/actions.py staging deploy

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/promote-release.yml
    with:
      run_id: ${{ inputs.run_id }}
      checks: ${{ inputs.checks }}
    secrets: inherit
