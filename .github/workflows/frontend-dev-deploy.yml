name: Verify and Package Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow never mutates servers. Staging and production consume this
# single frontend/backend bundle through scripts/release/manage.py.
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.11'
      - name: Check release tooling
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Backend tests with isolated configuration
        working-directory: backend
        run: |
          uv sync --locked
          uv run bash ../scripts/release/test-backend.sh -q
      - name: Frontend tests and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          pnpm install --frozen-lockfile
          pnpm test:unit
          pnpm build
      - name: Build immutable backend and package matching frontend
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "langear-release:$RELEASE_SHA" backend
          mkdir -p release
          docker save "langear-release:$RELEASE_SHA" | gzip > release/backend-image.tar.gz
          python3 scripts/release/package.py "$RELEASE_SHA" frontend/dist release
      - uses: actions/upload-artifact@v4
        with:
          name: langear-release-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
