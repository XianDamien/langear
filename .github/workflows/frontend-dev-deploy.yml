name: Verify and Package Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_HTTP_TIMEOUT: '120'
  UV_HTTP_RETRIES: '3'

# This workflow never mutates servers. Staging and production consume this
# single frontend/backend bundle through scripts/release/manage.py.
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    services:
      core-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lan30_test_ci
          POSTGRES_USER: core_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_test -d lan30_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check release tooling
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Backend tests with isolated configuration
        working-directory: backend
        run: |
          uv sync --locked
          uv run bash ../scripts/release/test-backend.sh -q
      - name: Collection core PostgreSQL integration tests
        working-directory: backend
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://core_test:isolated-ci-only@127.0.0.1:5432/lan30_test_ci
        run: uv run bash ../scripts/release/test-core.sh -q
      - name: Frontend tests and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/content/v1
        run: |
          pnpm install --frozen-lockfile
          pnpm test:unit
          pnpm build
      - name: Build immutable backend and package matching frontend
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUNTIME: review
        run: |
          docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "langear-release:$RELEASE_SHA" backend
          mkdir -p release
          docker save "langear-release:$RELEASE_SHA" | gzip > release/backend-image.tar.gz
          python3 scripts/release/package.py "$RELEASE_SHA" frontend/dist release
      - uses: actions/upload-artifact@v4
        with:
          name: langear-release-${{ github.sha }}
          path: release/
          retention-days: 30
          if-no-files-found: error
